name: fashion-forecast-bot

on:
  schedule:
    - cron: '0 6 * * *'     # runs daily at 06:00 UTC (10 PM PT)
    - cron: '0 18 * * *'    # runs daily at 18:00 UTC (10 AM PT)
  workflow_dispatch: {}      # allows manual “Run workflow” button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # allows commit & push of new data
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Run the full pipeline
      - name: Run Fashion Forecast pipeline
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: |
          python scripts/run_all.py

      # 5️⃣ Commit and push new outputs
      - name: Commit & push updated data and models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ models/
          git commit -m "auto: update data and models" || echo "no changes to commit"
          git push
