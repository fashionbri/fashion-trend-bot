name: fashion-forecast-bot

on:
  schedule:
    - cron: '7 6 * * *'
    - cron: '13 18 * * *'
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fashion Forecast pipeline
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: |
          python scripts/run_all.py

      # ⭐️ NEW STEP — generates daily + weekly output files
      - name: Build Daily & Weekly Summaries
        run: |
          python summary_compact.py

      - name: Commit & push updated data and models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ models/ || true
          git add summary_* *.md || true
          git commit -m "auto: update data, models, and summaries" || echo "no changes to commit"
          git push
