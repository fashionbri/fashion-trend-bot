name: Trend Bot (Light)

on:
  schedule:
    - cron: "15 9 * * *"    # 09:15 UTC (1:15 AM Pacific)
    - cron: "15 21 * * *"   # 21:15 UTC (1:15 PM Pacific)
  workflow_dispatch:         # lets you run it manually anytime

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
      PYTHONUNBUFFERED: "1"
      RUN_HEAVY: "0"
      RECENCY_MODE: "w"     # past week
      IMAGES_PER_QUERY: "20"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy opencv-python tqdm pandas

      - name: Run Trend Bot (Light)
        run: python fashion_trend_bot.py

      - name: Upload latest CSVs
        uses: actions/upload-artifact@v4
        with:
          name: latest-trend-csvs-light
          path: data/latest/

      - name: Commit data snapshot
        run: |
          git config user.name "trend-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest/ data/history/
          git commit -m "Daily light trend snapshot" || echo "No changes"
          git push
