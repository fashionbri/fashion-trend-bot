name: Fashion Trend Bot

on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC (10:00 PM PT)
  workflow_dispatch:

jobs:
  run-trend-bot:
    runs-on: ubuntu-latest
    env:
      SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
      RECENCY_MODE: "w"         # 'd'/'w'/'m'
      IMAGES_PER_QUERY: "40"    # tweak for runtime
      MAX_PER_DOMAIN: "5"
      RUN_HEAVY: "0"            # set to "1" for heavy modules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        run: python search_and_update.py

      - name: Upload latest CSVs
        uses: actions/upload-artifact@v4
        with:
          name: latest-trend-csvs
          path: data/latest/

      - name: Commit snapshot
        run: |
          git config user.name "trend-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest/ data/history/
          git commit -m "Trend snapshot" || echo "No changes"
          git push
