name: fashion-trend-bot
on:
  schedule:
    - cron: '0 6 * * *'   # morning (UTC)
    - cron: '0 18 * * *'  # night (UTC)
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run updater
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: python search_and_update.py

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push
